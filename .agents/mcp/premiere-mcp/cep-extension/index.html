<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Antigravity MCP Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: 12px;
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      background: #2d7d46;
      color: #fff;
    }
    .meta {
      margin-top: 8px;
      color: #aaa;
      word-break: break-all;
    }
    #log {
      margin-top: 8px;
      background: #141414;
      border: 1px solid #333;
      padding: 6px;
      height: 110px;
      overflow-y: auto;
      font-family: Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div>
    <span class="badge" id="status">Bridge Active</span>
  </div>
  <div class="meta" id="queueDir"></div>
  <div id="log">Initializing Antigravity Premiere MCP Bridge...</div>
  <script src="./main.js"></script>
</body>
</html>
